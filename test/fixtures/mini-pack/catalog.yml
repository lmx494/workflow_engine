parts:
  - id: sensor-read
    domain: sensor
    title: 传感器采集步骤
    api:
      - read_channel(channel: int, samples: int) -> int[]
    interface:
      input: { type: channel-id, unit: none }
      output: { type: int-array, unit: counts }
